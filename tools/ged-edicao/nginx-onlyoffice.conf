# ============================================================================
# nginx-onlyoffice.conf -- procurador /onlyoffice/ -> ONLYOFFICE Docs (Document Server)
# Patch 31 (edicao no navegador). NAO APLICAR antes de o Document Server estar instalado e a responder.
#
# Porque pelo nginx e nao directo ao Document Server:
#   * o index.html do DIROPS tem CSP 'self' (script-src, frame-src, connect-src): o api.js e o iframe do editor
#     so carregam se vierem da MESMA origem que a aplicacao -> http://srvkms001/onlyoffice/...
#   * o X-Frame-Options global e DENY; o editor e um iframe -> aqui repoe-se SAMEORIGIN so para /onlyoffice/.
#
# Onde colar (C:\dirops\sga-onpremise\nginx\conf\nginx.conf):
#   BLOCO 1 -> dentro de "http { ... }", junto aos outros "upstream" (antes do primeiro "server {").
#   BLOCO 2 -> dentro do "server { listen 80 default_server; ... }", ANTES de "location / {".
#   NUNCA no server docs.marciosager.com (o tunel publico so serve /s /p /v).
# Depois: nginx -t ; e reiniciar o servico do nginx (o "-s reload" nao funciona no servico, ver memoria).
# ============================================================================

# ---------------------------------------------------------------- BLOCO 1 (http)
# Document Server: na mesma maquina (instalador Windows com /DS_PORT=8080) ou numa VM dedicada (ex. 10.1.65.50:80).
upstream onlyoffice_ds { server 127.0.0.1:8080; }      # VM dedicada: server 10.1.65.50:80;

# websocket (o editor fala com o Document Server por socket.io)
map $http_upgrade $oo_connection {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- BLOCO 2 (server default)
        location /onlyoffice/ {
            proxy_pass http://onlyoffice_ds/;            # a barra final tira o prefixo /onlyoffice
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $oo_connection;
            # o Document Server constroi os seus enderecos (api.js, cache/files/...) a partir disto:
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            client_max_body_size 300m;                   # manuais grandes com imagens
            proxy_read_timeout 3600s;                    # sessoes de edicao longas (socket)
            proxy_send_timeout 3600s;
            # o editor abre num iframe da propria aplicacao: SAMEORIGIN em vez do DENY global
            # (add_header numa location substitui TODOS os herdados -> repor os outros dois)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

# Nada mais muda: o Document Server chega ao DIROPS pela location /functions/v1/ que ja existe
#   GET  /functions/v1/documentos-onlyoffice/ficheiro?t=...   (descarrega o .docx)
#   POST /functions/v1/documentos-onlyoffice/retorno?t=...    (callback)
# Se o Document Server estiver numa VM, essa VM tem de alcancar http://10.1.65.45 (porta 80) e o servidor
# SRVKMS001 tem de alcancar a VM na porta do Document Server (ver INSTALAR-ONLYOFFICE.md, "Portas").
