# nginx-vd.conf — rota pública /vd/<código> (verificação de revisão assinada, QR da cópia assinada) -> servidor de funções.
# NÃO é um ficheiro para incluir: são dois blocos para colar à mão em C:\dirops\sga-onpremise\nginx\conf\nginx.conf,
# cada um IMEDIATAMENTE A SEGUIR ao «location /cert/ { ... }» do mesmo bloco server (o mesmo molde que /cert/ usa).
# Antes de editar: copiar nginx.conf para nginx.conf.bak-antes-vd-<data>. Depois: nginx -t e Restart-Service dirops-nginx-v2
# (nginx -s reload não funciona com o serviço — ver memória).

# ── 1) server { listen 80 default_server; server_name _; }  (intranet, http://10.1.65.45) ──
        location /vd/ {
            proxy_pass http://functions_be;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /vd {
            return 302 /vd/;
        }

# ── 2) server { listen 80; server_name docs.marciosager.com; }  (túnel Cloudflare; $visitor_ip já definido no bloco) ──
        location /vd/ {
            proxy_pass http://functions_be;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $visitor_ip;
            proxy_set_header X-Forwarded-For $visitor_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        location = /vd {
            return 302 /vd/;
        }
