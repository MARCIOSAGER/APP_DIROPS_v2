<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">O leitor de aulas: cabeçalho da aula, área de conteúdo (vídeo com controlos), barra de acções com Anterior, Concluir e avançar e Próxima, índice lateral com o progresso e área de comentários</title>
  <rect width="1000" height="600" fill="#f4f6fa"/>
