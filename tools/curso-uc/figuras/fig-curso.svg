<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A página de um curso: cabeçalho com título e resumo, conteúdo por módulos com as aulas, sessões presenciais, avaliação, e o cartão lateral com o botão de inscrição e os factos do curso</title>
  <rect width="1000" height="600" fill="#f4f6fa"/>
  <text x="40" y="40" font-size="13" fill="#64748b">← Catálogo</text>
  <rect x="40" y="56" width="80" height="20" rx="5" fill="#e2e8f0"/><text x="50" y="70" font-size="11" fill="#334155">Operações</text>
  <rect x="128" y="56" width="76" height="20" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="138" y="70" font-size="11" fill="#334155">Intermédio</text>
  <text x="40" y="112" font-size="26" font-weight="700" fill="#0f172a">Global Reporting Format (GRF)</text>
  <text x="40" y="140" font-size="12" fill="#475569">Aprenda a avaliar e a reportar a condição da pista com o GRF… Para quem: OPA, supervisores, AIS.</text>
  <text x="40" y="160" font-size="12" fill="#475569">No fim do curso sabe: avaliar cada terço · preencher o RCR · aplicar o RBA · cumprir a IT da SGA.</text>
  <text x="40" y="188" font-size="12" fill="#64748b">👤 Marcio Sager   ▤ 8 módulos   ☑ 24 aulas   ⏱ 9 h</text>
  <!-- conteúdo -->
  <rect x="40" y="210" width="620" height="370" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="240" font-size="15" font-weight="700" fill="#0f172a">Conteúdo do curso</text>
  <text x="60" y="260" font-size="11" fill="#64748b">🔒 Inscreva-se para aceder às aulas.</text>
  <g font-size="12" fill="#0f172a">
    <text x="60" y="292" font-weight="700">01  O que é o GRF e base regulatória</text><text x="560" y="292" font-size="11" fill="#64748b">5 aulas · 1h25</text>
    <text x="90" y="316" fill="#334155">🔒 📖 O que é o GRF</text><text x="560" y="316" font-size="11" fill="#64748b">Leitura · 20 min</text>
    <text x="90" y="338" fill="#334155">🔒 📄 Apresentação do seminário (PDF)</text><text x="560" y="338" font-size="11" fill="#64748b">PDF · 30 min</text>
    <text x="90" y="360" fill="#334155">🔒 ▶ Vídeo: The ICAO GRF (legendas PT)</text><text x="560" y="360" font-size="11" fill="#64748b">Vídeo · 10 min</text>
    <text x="60" y="392" font-weight="700">02  Conceitos: terços da pista, contaminantes e RCAM</text><text x="560" y="392" font-size="11" fill="#64748b">4 aulas · 1h20</text>
    <text x="90" y="416" fill="#334155">🔒 📖 Terços da pista e código RWYCC</text><text x="560" y="416" font-size="11" fill="#64748b">Leitura · 25 min</text>
    <text x="60" y="448" font-weight="700">…</text>
  </g>
  <rect x="60" y="470" width="580" height="1" fill="#e2e8f0"/>
  <text x="60" y="500" font-size="13" font-weight="700" fill="#5b21b6">📅 Sessões presenciais</text><text x="60" y="520" font-size="11" fill="#475569">Inscreva-se numa sessão (sala ou online); a presença conclui a aula prática.</text>
  <text x="60" y="552" font-size="13" font-weight="700" fill="#5b21b6">📋 Avaliação</text><text x="60" y="572" font-size="11" fill="#475569">O curso conclui, e o certificado é emitido, ao aprovar na avaliação.</text>
  <!-- cartão lateral -->
  <rect x="690" y="210" width="270" height="290" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <rect x="690" y="210" width="270" height="110" rx="14" fill="#1e3a5f"/><rect x="690" y="300" width="270" height="20" fill="#1e3a5f"/>
  <rect x="710" y="336" width="230" height="40" rx="10" fill="#1e3a5f"/><text x="782" y="362" font-size="14" fill="#fff" font-weight="700">Inscrever-se</text>
  <text x="712" y="396" font-size="10" fill="#64748b">Acesso imediato · avance ao seu ritmo</text>
  <g font-size="12" fill="#334155">
    <text x="710" y="428">👤 Instrutor</text><text x="840" y="428" fill="#0f172a">Marcio Sager</text>
    <text x="710" y="452">⏱ Carga horária</text><text x="840" y="452" fill="#0f172a">9 h · 24 aulas</text>
    <text x="710" y="476">▤ Nível</text><text x="840" y="476" fill="#0f172a">Intermédio</text>
  </g>
  <!-- setas -->
  <g font-size="12" fill="#a1823a" font-weight="700">
    <text x="690" y="530">① inscreva-se aqui</text>
    <text x="690" y="552">② depois o botão passa a "Continuar"</text>
    <text x="690" y="574">③ e as aulas destrancam-se</text>
  </g>
</svg>
