<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A Gestão de Formação: os nove separadores principais (Visão geral, Cursos, Alunos, Matriz, Trilhas, Perguntas, Certificados, Assinantes, Instrutores) e, dentro de um curso, os sete separadores do editor (Conteúdo, Avaliação, Sessões, Alunos, Certificado, Analítica, Versões)</title>
  <rect width="1000" height="560" fill="#f4f6fa"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">Gestão de Formação</text>
  <text x="30" y="62" font-size="12" fill="#64748b">Só instrutores e administradores. Cada instrutor edita os cursos de que é responsável ou co-instrutor.</text>
  <!-- separadores principais -->
  <g font-size="12">
    <rect x="30" y="84" width="104" height="30" rx="8" fill="#1e3a5f"/><text x="44" y="104" fill="#fff" font-weight="700">Visão geral</text>
    <rect x="140" y="84" width="76" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="154" y="104" fill="#334155">Cursos</text>
    <rect x="222" y="84" width="76" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="236" y="104" fill="#334155">Alunos</text>
    <rect x="304" y="84" width="76" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="320" y="104" fill="#334155">Matriz</text>
    <rect x="386" y="84" width="76" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="402" y="104" fill="#334155">Trilhas</text>
    <rect x="468" y="84" width="92" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="482" y="104" fill="#334155">Perguntas</text>
    <rect x="566" y="84" width="104" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="580" y="104" fill="#334155">Certificados</text>
    <rect x="676" y="84" width="100" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="690" y="104" fill="#334155">Assinantes</text>
    <rect x="782" y="84" width="100" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="796" y="104" fill="#334155">Instrutores</text>
  </g>
  <g font-size="11" fill="#334155">
    <text x="30" y="142"><tspan font-weight="700" fill="#1e3a5f">Visão geral</tspan> — conformidade por perfil e aeroporto, vencimentos a 30/60/90 dias, pendências, horas de estudo, PDF.</text>
    <text x="30" y="162"><tspan font-weight="700" fill="#1e3a5f">Cursos</tspan> — criar, editar, publicar; abre o editor do curso (em baixo).   <tspan font-weight="700" fill="#1e3a5f">Alunos</tspan> — ficha de cada colaborador, inscrição em massa, lembretes.</text>
    <text x="30" y="182"><tspan font-weight="700" fill="#1e3a5f">Matriz</tspan> — colaboradores × cursos obrigatórios (válido, em curso, em falta, expirado), com formação externa.   <tspan font-weight="700" fill="#1e3a5f">Trilhas</tspan> — percursos por função.</text>
    <text x="30" y="202"><tspan font-weight="700" fill="#1e3a5f">Perguntas</tspan> — banco global.   <tspan font-weight="700" fill="#1e3a5f">Certificados</tspan> — emitidos, revogar, reemitir.   <tspan font-weight="700" fill="#1e3a5f">Assinantes</tspan> — quem assina.   <tspan font-weight="700" fill="#1e3a5f">Instrutores</tspan> — perfil e cursos de cada um.</text>
  </g>
  <!-- editor do curso -->
  <rect x="30" y="230" width="940" height="300" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <rect x="50" y="250" width="72" height="20" rx="5" fill="#059669"/><text x="60" y="264" font-size="11" fill="#fff">Publicado</text>
  <rect x="130" y="250" width="34" height="20" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="140" y="264" font-size="11" fill="#334155">v2</text>
  <text x="50" y="296" font-size="18" font-weight="700" fill="#0f172a">Global Reporting Format (GRF)</text>
  <text x="50" y="316" font-size="11" fill="#64748b">8 módulos · 24 aulas · 9h · Marcio Sager</text>
  <rect x="700" y="252" width="90" height="28" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="712" y="271" font-size="11" fill="#334155">Publicado ●</text>
  <rect x="798" y="252" width="80" height="28" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="810" y="271" font-size="11" fill="#334155">✎ Editar</text>
  <rect x="886" y="252" width="70" height="28" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="896" y="271" font-size="11" fill="#334155">👁 Aluno</text>
  <g font-size="12">
    <rect x="50" y="340" width="104" height="30" rx="8" fill="#1e3a5f"/><text x="64" y="360" fill="#fff" font-weight="700">▤ Conteúdo</text>
    <rect x="160" y="340" width="104" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="174" y="360" fill="#334155">📋 Avaliação</text>
    <rect x="270" y="340" width="96" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="284" y="360" fill="#334155">📅 Sessões</text>
    <rect x="372" y="340" width="86" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="386" y="360" fill="#334155">👥 Alunos</text>
    <rect x="464" y="340" width="112" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="478" y="360" fill="#334155">🏅 Certificado</text>
    <rect x="582" y="340" width="104" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="596" y="360" fill="#334155">📊 Analítica</text>
    <rect x="692" y="340" width="96" height="30" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="706" y="360" fill="#334155">🕘 Versões</text>
  </g>
  <g font-size="11" fill="#334155">
    <text x="50" y="400"><tspan font-weight="700" fill="#1e3a5f">Conteúdo</tspan> — módulos e aulas (vídeo, PDF, texto, HTML5/SCORM/H5P, ligação, presencial), materiais, créditos.</text>
    <text x="50" y="420"><tspan font-weight="700" fill="#1e3a5f">Avaliação</tspan> — banco de perguntas do curso, construtor do quiz, resultados e correcção manual.   <tspan font-weight="700" fill="#1e3a5f">Sessões</tspan> — presenciais/online, presenças.</text>
    <text x="50" y="440"><tspan font-weight="700" fill="#1e3a5f">Alunos</tspan> — inscritos, progresso, certificados, lembretes.   <tspan font-weight="700" fill="#1e3a5f">Certificado</tspan> — editor visual e signatários.</text>
    <text x="50" y="460"><tspan font-weight="700" fill="#1e3a5f">Analítica</tspan> — funil por aula, dificuldade das perguntas, por aeroporto.   <tspan font-weight="700" fill="#1e3a5f">Versões</tspan> — retratos do conteúdo para comparar/restaurar.</text>
    <text x="50" y="500" fill="#a1823a" font-weight="700">Cabeçalho: interruptor Publicado (só com pelo menos uma aula) · Editar dados · Ver como aluno · versão actual (vN)</text>
  </g>
</svg>
