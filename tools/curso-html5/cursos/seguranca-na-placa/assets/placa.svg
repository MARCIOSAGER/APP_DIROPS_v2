<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
  <title id="t">Posição de estacionamento na placa</title>
  <desc id="d">Esquema: aeronave na posição, zona de segurança do equipamento a tracejado, linha de segurança da placa a vermelho e via de serviço com viatura.</desc>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e3a5f"/></marker>
  </defs>
  <rect width="900" height="460" fill="#cfd6df"/>
  <!-- via de serviço -->
  <rect x="0" y="360" width="900" height="70" fill="#9aa5b1"/>
  <line x1="0" y1="395" x2="900" y2="395" stroke="#ffffff" stroke-width="3" stroke-dasharray="26 18"/>
  <text x="14" y="450" font-family="Segoe UI, Arial" font-size="16" fill="#1e3a5f" font-weight="700">Via de serviço (viaturas e peões)</text>
  <!-- linha de segurança da placa -->
  <line x1="0" y1="340" x2="900" y2="340" stroke="#c81e1e" stroke-width="6"/>
  <text x="560" y="330" font-family="Segoe UI, Arial" font-size="15" fill="#c81e1e" font-weight="700">Linha de segurança da placa</text>
  <!-- ERA -->
  <rect x="150" y="40" width="600" height="280" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-dasharray="14 10" rx="12"/>
  <text x="160" y="66" font-family="Segoe UI, Arial" font-size="15" fill="#1e3a5f" font-weight="700">Zona de segurança do equipamento (ERA)</text>
  <!-- linha de eixo -->
  <line x1="450" y1="40" x2="450" y2="320" stroke="#f2c200" stroke-width="5"/>
  <!-- aeronave (vista de cima, simplificada) -->
  <g fill="#ffffff" stroke="#1e3a5f" stroke-width="3">
    <ellipse cx="450" cy="190" rx="26" ry="120"/>
    <path d="M450 150 L250 230 L250 250 L450 200 Z"/>
    <path d="M450 150 L650 230 L650 250 L450 200 Z"/>
    <path d="M450 290 L400 318 L400 326 L450 306 Z"/>
    <path d="M450 290 L500 318 L500 326 L450 306 Z"/>
    <rect x="300" y="222" width="42" height="26" rx="8" fill="#a1823a"/>
    <rect x="558" y="222" width="42" height="26" rx="8" fill="#a1823a"/>
  </g>
  <!-- jet blast -->
  <g fill="none" stroke="#c81e1e" stroke-width="3" opacity=".8">
    <path d="M321 256 q-20 30 -10 60"/><path d="M579 256 q20 30 10 60"/>
  </g>
  <text x="595" y="300" font-family="Segoe UI, Arial" font-size="14" fill="#c81e1e" font-weight="700">jet blast</text>
  <!-- calços -->
  <rect x="436" y="300" width="10" height="8" fill="#1e3a5f"/><rect x="454" y="300" width="10" height="8" fill="#1e3a5f"/>
  <!-- marshaller -->
  <g transform="translate(450 20)">
    <circle cx="0" cy="0" r="8" fill="#f2c200" stroke="#1e3a5f" stroke-width="2"/>
    <text x="14" y="5" font-family="Segoe UI, Arial" font-size="14" fill="#1e3a5f" font-weight="700">marshaller</text>
  </g>
  <!-- viatura -->
  <g transform="translate(60 372)">
    <rect x="0" y="0" width="70" height="40" rx="8" fill="#a1823a" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="10" y="8" width="22" height="24" rx="4" fill="#ffffff"/>
    <text x="80" y="27" font-family="Segoe UI, Arial" font-size="14" fill="#1e3a5f">só entra na ERA depois de: aeronave parada · anti-colisão apagadas · calços</text>
  </g>
  <!-- peão -->
  <g transform="translate(820 372)">
    <circle cx="20" cy="8" r="7" fill="#f2c200" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="12" y="16" width="16" height="22" rx="4" fill="#f2c200" stroke="#1e3a5f" stroke-width="2"/>
  </g>
</svg>
