<!doctype html>
<html lang="pt" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App já é em português: proibir a tradução automática do navegador. O Google
         Tradutor troca nós de texto por <font>, e o React rebenta com "insertBefore/
         removeChild ... não é filho deste nó". notranslate evita esse crash. -->
    <meta name="google" content="notranslate" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options must be set via HTTP header (see nginx config), not meta -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob: https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self';" />
    <link href="/fonts/plus-jakarta.css" rel="stylesheet">
    <title>Sistema DIROPS — Gestão Aeroportuária</title>
    <meta name="description" content="Sistema DIROPS — gestão de operações aeroportuárias. Controle de voos, tarifas, segurança, auditorias e credenciamentos." />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sistema DIROPS — Gestão Aeroportuária" />
    <meta property="og:description" content="Controle de voos, tarifas, seguranca, auditorias e credenciamentos num unico sistema." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sistema DIROPS — Gestão Aeroportuária" />
    <meta name="twitter:description" content="Controle de voos, tarifas, seguranca, auditorias e credenciamentos." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme color (mobile browser bar) -->
    <meta name="theme-color" content="#004A99" />

    <!-- PWA / Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
